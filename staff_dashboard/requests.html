<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquipTrack | Borrowing Requests</title>
    <link rel="icon" type="image/png" href="../pics/logoequip.png">
    <link rel="stylesheet" href="../styles.css">
    <script src="../scripts.js" defer></script>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="../pics/equiptrack.png" alt="EquipTrack - CICS Equipment System" class="sidebar-logo-full">
        </div>

        <nav>
            <a href="staff.html">Dashboard</a>
            <a href="requests.html" class="active">Borrowing Requests</a>
            <a href="staff_equipment.html">Equipment Management</a>
            <a href="staff_history.html">Borrowing History</a>
        </nav>

        <button id="logoutBtn">Logout</button>
    </div>

    <main class="main-content">

        <div class="page-header">
            <h1>Borrowing Requests</h1>
            <p>Review and manage equipment borrowing applications from CICS users.</p>
        </div>

        <div id="staffRequestsList" class="borrowings-grid"></div>

        <div id="emptyStaffRequests" hidden>
            <h3>No Borrowing Requests Yet</h3>
            <p>Student borrowing requests will appear here.</p>
        </div>

    </main>

    <!-- LOGOUT CONFIRMATION MODAL -->
    <div id="logoutModal" class="logout-modal" hidden>
        <div class="logout-modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to log out?</p>

            <button id="confirmLogout">Yes, Logout</button>
            <button id="cancelLogout">Cancel</button>
        </div>
    </div>

</body>
</html>
