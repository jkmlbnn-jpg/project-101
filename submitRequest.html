<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equiptrack/submitRequest</title>
</head>
<body>
        <div class="item-container">
            <h2>Item Information:</h2>
            <form id="itemForm">
                <label> Selected Item:</label>
                <div id="itemInfo" class="item-info"></div>
                <h3 id="itemName"></h3>
                <p> Category: <span id="itemCategory"></span></p>
                <p> Item CCode: <span id="itemCode"></span></p>
                <p> Status: </p> <span id="itemStatus"></span>
                
                <label>Name</label>
                <input type="text" id="name" placeholder="Juan Dela Cruz" required> <br>
                <label>Sr-code</label>
                <input type="text" id="srCode" placeholder="24-00000" required> <br>
                <label>Block</label>
                <input type="text" id="block" placeholder="IT-3112" required> <br>
                <label>Return Date</label>
                <input type="date" id="returnDate" placeholder="3days" required> <br>
                <p>3 days</p>
                <button type="submit">Submit Request</button>
            </form>
        </div>
    </div>
</body>
</html>
